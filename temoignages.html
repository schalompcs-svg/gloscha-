<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Témoignages — GPIAN</title><link rel="stylesheet" href="style.css"><script src="assets/gpian-api.js"></script></head><body><main class="section"><div class="container"><div class="section-head"><div class="eyebrow">TÉMOIGNAGES</div><h1>TÉMOIGNAGES</h1><p>Chaque témoignage indique clairement la zone qui l’a publié.</p></div><div id="list" class="grid"></div><p id="empty">Chargement…</p></div></main><script>function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}gpianFetch('get-zone-content?type=testimony').then(r=>r.json()).then(d=>{let a=d.items||[];document.getElementById('empty').textContent=a.length?'':'Aucun témoignage publié.';document.getElementById('list').innerHTML=a.map(x=>'<article class="card"><div class="card-body"><span class="badge">ZONE '+esc(x.zone)+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.content)+'</p><small>Publié par la Zone '+esc(x.zone)+'</small></div></article>').join('')}).catch(()=>document.getElementById('empty').textContent='Impossible de charger les témoignages.');</script></body></html>
