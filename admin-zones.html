<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JÉSUS — Administration GPIAN</title><link rel="stylesheet" href="style.css"><style>body{background:#f4f7fb}.admin{max-width:900px;margin:30px auto;padding:15px}.box{background:#fff;border-radius:18px;padding:24px;box-shadow:0 10px 35px #0001}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd5df;border-radius:10px;box-sizing:border-box}.zone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.zone-grid button,button{padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{font-weight:700}@media(max-width:700px){.zone-grid,.row{grid-template-columns:1fr}}</style><style>.admin{color:#4B1528}.admin .box{border:1px solid #ED93B1}.admin h1,.admin h2{color:#4B1528}.admin button{background:#D4537E;color:#4B1528;border:1px solid #ED93B1}.admin .zone-grid button:disabled{opacity:.45}.admin .status{color:#4B1528}.admin label{color:#4B1528}</style><script src="assets/gpian-api.js"></script></head><body><div class="admin"><div class="box"><h1>✝ JÉSUS — Administration GPIAN</h1><div id="login"><h2>Accès par zone</h2><div class="zone-grid"><button data-zone="A">ZONE A</button><button data-zone="B">ZONE B</button><button data-zone="C">ZONE C</button><button data-zone="D">ZONE D</button></div><label>Identifiant</label><input id="user" autocomplete="username"><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><label>Émetteur</label><input id="emetteur" placeholder="Nom de la zone / responsable"><button id="loginBtn">🔐 SE CONNECTER</button><p id="loginStatus" class="status"></p></div><div id="panel" class="hidden"><h2 id="zoneTitle"></h2><p>Chaque zone possède son propre espace de publication.</p><label>Type</label><select id="type"><option value="testimony">Témoignage</option><option value="preaching">Prédication</option><option value="report">Compte rendu</option></select><label>Titre</label><input id="title"><label>Contenu</label><textarea id="content" rows="8"></textarea><div class="row"><div><label>Auteur / orateur</label><input id="author"></div><div><label>Thème / référence</label><input id="meta"></div></div><label>Photos</label><input id="photos" type="file" accept="image/*" multiple><button id="publish">📤 PUBLIER</button><p id="pubStatus" class="status"></p><button id="logout" type="button">🔒 SE DÉCONNECTER</button><p><a href="index.html">← Retour au site</a></p></div></div></div><script>let zone=null;const $=id=>document.getElementById(id);document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{zone=b.dataset.zone;document.querySelectorAll('[data-zone]').forEach(x=>x.disabled=x!==b);$('zoneTitle').textContent='Administration — Zone '+zone});$('loginBtn').onclick=async()=>{if(!zone){$('loginStatus').textContent='❌ Choisis une zone.';return}$('loginStatus').textContent='🔐 Vérification…';try{const r=await gpianFetch('zone-login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({zone,username:$('user').value,password:$('pass').value,emetteur:$('emetteur').value.trim()})});const d=await r.json();if(d.ok){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}else $('loginStatus').textContent='❌ Identifiants incorrects.'}catch(e){$('loginStatus').textContent='❌ Serveur indisponible.'}};$('publish').onclick=async()=>{const st=$('pubStatus');if(!$('title').value.trim()||!$('content').value.trim()){st.textContent='❌ Titre et contenu obligatoires.';return}st.textContent='📤 Publication…';const photos=[];for(const f of $('photos').files){photos.push({name:f.name,data:await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(f)})})}try{const r=await gpianFetch('zone-publish',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:$('type').value,title:$('title').value.trim(),content:$('content').value.trim(),author:$('author').value.trim(),meta:$('meta').value.trim(),emetteur:$('emetteur').value.trim(),photos})});const d=await r.json();st.textContent=d.ok?'✅ Publication ajoutée.':'❌ '+(d.error||'Erreur');if(d.ok){$('title').value='';$('content').value='';$('author').value='';$('meta').value='';$('photos').value='';$('emetteur').value=''}}catch(e){st.textContent='❌ Serveur indisponible.'}};$('logout').onclick=async()=>{try{await gpianFetch('zone-logout',{method:'POST'})}finally{location.href='index.html'}};</script></body></html>
