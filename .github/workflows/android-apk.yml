name: GPIAN - Build APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Construire APK GPIAN
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet GPIAN
        uses: actions/checkout@v6

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Vérifier le projet Android
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          echo "✓ Projet Android détecté"
          chmod +x android/gradlew

      - name: Synchroniser Capacitor
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Construire APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Vérifier APK
        run: |
          echo "=== APK PRODUIT ==="
          find android/app/build/outputs/apk -type f -name "*.apk" -print
          test -n "$(find android/app/build/outputs/apk -type f -name "*.apk" -print -quit)"

      - name: Publier APK GPIAN
        uses: actions/upload-artifact@v4
        with:
          name: GPIAN-APK-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
