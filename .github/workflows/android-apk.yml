name: Construire APK GPIAN - Version corrigee exacte

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK Android GPIAN version corrigee
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet GPIAN
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verifier la vraie version GPIAN corrigee
        shell: bash
        run: |
          set -e

          echo "=== VERIFICATION DOSSIER WWW ==="

          test -d www
          test -f www/index.html
          test -f www/predications.html
          test -f www/sites.html
          test -f www/temoignages.html
          test -f www/comptes-rendus.html
          test -f www/alliance-prophetique.html
          test -f www/tv.html
          test -f www/style.css
          test -f capacitor.config.ts
          test -f package.json

          echo "OK : version GPIAN corrigee trouvee dans www"

          echo "=== CONTROLE DESIGN ==="
          grep -Ril "GPIAN\|Arche de Noé\|Arche de Noe" www | head -30

          echo "=== CONTROLE NAVIGATION ==="
          grep -Ril "PRÉDICATIONS\|PREDICATIONS\|NOS ÉGLISES\|TÉMOIGNAGES\|COMPTES RENDUS\|ALLIANCE PROPHÉTIQUE" www | head -30

          echo "=== TAILLE WWW ==="
          du -sh www

      - name: Installer les dependances
        run: npm install

      - name: Verifier Capacitor
        shell: bash
        run: |
          set -e

          node -e "
          const fs = require('fs');
          const text = fs.readFileSync('capacitor.config.ts', 'utf8');
          if (!text.includes(\"webDir: 'www'\")) {
            console.error('ERREUR : webDir ne pointe pas vers www');
            process.exit(1);
          }
          console.log('OK : Capacitor utilise www');
          "

      - name: Supprimer uniquement Android sur le runner
        shell: bash
        run: |
          set -e
          rm -rf android
          npx cap add android

      - name: Synchroniser la vraie version web corrigee
        shell: bash
        run: |
          set -e

          npx cap sync android

          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/style.css
          test -d android/app/src/main/assets/public/assets

          echo "OK : contenu web corrige copie dans Android"

          echo "=== VERIFICATION LOGOS ==="
          find android/app/src/main/assets/public/assets \
            -type f \
            \( -iname '*logo*' -o -iname '*icon*' \) \
            | head -30

      - name: Construire APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK GPIAN
        uses: actions/upload-artifact@v4
        with:
          name: GPIAN-APK-VERSION-CORRIGEE-EXACTE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
