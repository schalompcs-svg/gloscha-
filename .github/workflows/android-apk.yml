name: Construire APK GPIAN MAX - toutes modifications

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK GPIAN MAX complet
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Vérifier la version complète
        run: |
          set -e
          node scripts/validate-gpian.js
          test -f www/admin5.html
          test -f www/assets/gpian-runtime.js
          test -f netlify/functions/admin5-api.js
          test -f www/assets/pasteurs/zones-affectations.json
          node --check netlify/functions/admin5-api.js

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier Capacitor
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('capacitor.config.ts','utf8'); if(!s.includes(\"webDir: 'www'\")) process.exit(1); console.log('webDir www OK')"

      - name: Créer Android sur le runner
        run: |
          rm -rf android
          npx cap add android

      - name: Synchroniser www vers Android
        run: |
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/admin5.html
          test -f android/app/src/main/assets/public/assets/gpian-runtime.js
          test -f android/app/src/main/assets/public/assets/pasteurs/zones-affectations.json

      - name: Construire APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: GPIAN-MAX-APK-TOUTES-MODIFICATIONS
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
