<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prédications - GPIAN</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .pred-container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .pred-card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .pred-card h2 {
      margin-top: 0;
    }

    .pred-text {
      white-space: pre-wrap;
      line-height: 1.8;
      font-size: 17px;
    }

    .pred-date {
      opacity: .7;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .pred-photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .pred-photos img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    /* ADMINISTRATION CACHÉE */
    #jesus-admin {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #fff;
      overflow-y: auto;
      padding: 20px;
    }

    .admin-box {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .admin-box h1 {
      margin-top: 10px;
    }

    .admin-box input[type="text"],
    .admin-box textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      margin-top: 12px;
      font-family: inherit;
    }

    .admin-box textarea {
      min-height: 520px;
      resize: vertical;
      line-height: 1.6;
    }

    .photo-label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    #pred-photos {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
    }

    #photo-preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    #photo-preview img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
    }

    .admin-button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    .admin-close {
      background: #b00020;
    }

    .admin-clear {
      background: #555;
    }

    #admin-status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
    }

    .empty-message {
      text-align: center;
      padding: 30px 10px;
      opacity: .75;
    }
  </style>
</head>

<body><style>
body{background:#f4f6f9}
.gp-hero{background:linear-gradient(135deg,#061426,#173d63);color:white;text-align:center;padding:70px 20px}
.gp-hero h1{font-size:clamp(42px,9vw,76px);margin:15px 0;font-weight:900}
.gp-hero p{max-width:750px;margin:auto;font-size:18px;line-height:1.7;color:#dce5ef}
.gp-wrap{width:min(1100px,92%);margin:auto}
.gp-search{margin:-28px auto 45px}
.gp-search input{width:100%;padding:20px;border:0;border-radius:18px;font-size:17px;box-shadow:0 12px 35px #0002}
.gp-list{display:grid;gap:30px;padding-bottom:70px}
.gp-card{background:white;border-radius:24px;overflow:hidden;box-shadow:0 10px 35px #0002}
.gp-head{padding:30px;border-bottom:1px solid #eee}
.gp-num{color:#c99a3d;font-weight:bold;letter-spacing:3px}
.gp-title{font-size:clamp(30px,6vw,48px);color:#061426;margin:12px 0;font-weight:900}
.gp-date{color:#687386}
.gp-body{padding:30px}
.gp-text{white-space:pre-wrap;font-size:18px;line-height:1.9}
.gp-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:30px}
.gp-photos img{width:100%;height:260px;object-fit:cover;border-radius:16px}
.gp-empty{text-align:center;background:white;padding:65px 20px;border-radius:24px}
#jesus-trigger{text-align:center;padding:65px 20px 25px;color:#888;font-size:11px;letter-spacing:4px;cursor:pointer}
#jesus-admin{display:none;position:fixed;inset:0;z-index:999999;background:#061426;overflow:auto;padding:20px}
.j-box{max-width:900px;margin:auto;background:white;border-radius:24px;padding:30px}
.j-box input,.j-box textarea,.j-box button{width:100%;padding:15px;margin:8px 0;box-sizing:border-box;border-radius:12px;font-size:16px}
.j-box textarea{min-height:430px}
.j-box button{border:0;background:#061426;color:white;font-weight:bold}
.j-close{background:#a51616!important}
#photo-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
#photo-preview img{width:100%;height:180px;object-fit:cover;border-radius:14px}
</style>
<div class="gp-hero"><div class="gp-wrap"><div>✝ L’ARCHE DE NOÉ • GPIAN</div><h1>PRÉDICATIONS</h1><p>Messages, enseignements et paroles pour fortifier la foi et conduire les cœurs vers Jésus-Christ.</p></div></div>
<main class="gp-wrap">
<div class="gp-search"><input id="gp-search" placeholder="🔎 Rechercher une prédication ou un thème..." oninput="afficherPredications()"></div>
<section id="publications" class="gp-list"></section>
</main>
<div id="jesus-trigger" onclick="ouvrirAdmin()">✝ JÉSUS</div>
<section id="jesus-admin"><div class="j-box">
<h1>✝ Administration — Prédications</h1>
<div id="login-zone">
<input id="admin-user" placeholder="Identifiant">
<input id="admin-pass" type="password" placeholder="Mot de passe">
<button onclick="connexion()">🔐 SE CONNECTER</button>
<p id="login-status"></p>
</div>
<div id="admin-panel" style="display:none">
<h2>📖 Nouvelle prédication</h2>
<input id="titre" placeholder="GRAND TITRE / THÈME DE LA PRÉDICATION">
<textarea id="texte" placeholder="THÈME :&#10;TEXTE BIBLIQUE :&#10;INTRODUCTION :&#10;ENSEIGNEMENT :&#10;VERSETS :&#10;CONCLUSION :&#10;PRIÈRE :"></textarea>
<h3>📷 Photos</h3>
<input id="photos" type="file" accept="image/*" multiple onchange="previsualiser()">
<div id="photo-preview"></div>
<button onclick="publier()">📖 PUBLIER LA PRÉDICATION</button>
<button class="j-close" onclick="fermerAdmin()">FERMER</button>
<p id="admin-status"></p>
</div></div></section>
<script>
let gpPhotos=[];
function ouvrirAdmin(){document.getElementById("jesus-admin").style.display="block"}
function fermerAdmin(){document.getElementById("jesus-admin").style.display="none"}
async function connexion(){
let st=document.getElementById("login-status");
st.textContent="🔐 Vérification...";
try{
let r=await fetch("/.netlify/functions/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("admin-user").value,password:document.getElementById("admin-pass").value})});
let d=await r.json();
if(d.ok){document.getElementById("login-zone").style.display="none";document.getElementById("admin-panel").style.display="block"}
else st.textContent="❌ Identifiants incorrects.";
}catch(e){st.textContent="❌ Serveur indisponible."}
}
function previsualiser(){
let z=document.getElementById("photo-preview");z.innerHTML="";gpPhotos=[];
[...document.getElementById("photos").files].forEach(f=>{
let r=new FileReader();r.onload=e=>{gpPhotos.push({data:e.target.result,legend:""});z.innerHTML+=`<div><img src="${e.target.result}"><input placeholder="Légende de la photo"></div>`};r.readAsDataURL(f)
})
}
function publier(){
let titre=document.getElementById("titre").value.trim(),texte=document.getElementById("texte").value.trim(),st=document.getElementById("admin-status");
if(!titre||!texte){st.textContent="❌ Titre et prédication obligatoires.";return}
let pubs=JSON.parse(localStorage.getItem("gpian_predications")||"[]");
pubs.unshift({id:Date.now(),titre:titre,texte:texte,photos:gpPhotos,date:new Date().toLocaleDateString("fr-FR")});
localStorage.setItem("gpian_predications",JSON.stringify(pubs));
document.getElementById("titre").value="";document.getElementById("texte").value="";document.getElementById("photos").value="";document.getElementById("photo-preview").innerHTML="";gpPhotos=[];
afficherPredications();st.textContent="✅ Prédication publiée.";
}
function esc(x){return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function afficherPredications(){
let z=document.getElementById("publications"),q=document.getElementById("gp-search").value.toLowerCase(),p=JSON.parse(localStorage.getItem("gpian_predications")||"[]").filter(x=>String(x.titre).toLowerCase().includes(q)||String(x.texte).toLowerCase().includes(q));
if(!p.length){z.innerHTML=`<div class="gp-empty"><div style="font-size:55px">📖</div><h2>Aucune prédication disponible</h2><p>Les nouvelles prédications apparaîtront ici.</p></div>`;return}
z.innerHTML=p.map((x,i)=>`<article class="gp-card"><div class="gp-head"><div class="gp-num">PRÉDICATION ${String(i+1).padStart(2,"0")}</div><h2 class="gp-title">${esc(x.titre)}</h2><div class="gp-date">📅 ${esc(x.date)}</div></div><div class="gp-body"><div class="gp-text">${esc(x.texte)}</div>${x.photos&&x.photos.length?`<div class="gp-photos">${x.photos.map(a=>`<img src="${a.data}" alt="">`).join("")}</div>`:""}</div></article>`).join("")}
}
afficherPredications();
</script>
</body></html>
